<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWD Layout 480px</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            background-color: #56b0f5; /* 藍色背景 */
            display: flex;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        /* 區塊通用設定 */
        .item {
            border-radius: 4px;
            margin-bottom: 15px;
        }

        /* 頂部綠色區塊 */
        .header {
            background-color: #b8d962;
            height: 120px;
        }

        /* 中間青色區塊：預設 (b) 模式為 3 欄並排 */
        .middle-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px;
            margin-bottom: 15px;
        }

        .middle-item {
            background-color: #5ebec4;
            height: 150px;
        }

        /* 下方灰色區塊：預設 (b) 模式為 4 欄並排 */
        .bottom-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .bottom-item {
            background-color: #f0f0f0;
            height: 60px;
        }

        /* --- 響應式切換點：當寬度小於 480px --- */
        @media screen and (max-width: 480px) {
            
            /* (a) 中間變為 1 欄垂直堆疊 */
            .middle-grid {
                grid-template-columns: 1fr;
            }
            
            /* (a) 下方變為 2 欄 (2x2 網格) */
            .bottom-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .middle-item {
                height: 100px; /* 手機版略微縮小高度 */
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="item header"></div>

    <div class="middle-grid">
        <div class="item middle-item"></div>
        <div class="item middle-item"></div>
        <div class="item middle-item"></div>
    </div>

    <div class="bottom-grid">
        <div class="item bottom-item"></div>
        <div class="item bottom-item"></div>
        <div class="item bottom-item"></div>
        <div class="item bottom-item"></div>
    </div>
</div>

</body>
</html>
